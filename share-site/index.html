<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wynik meczu — Tennis Tracker</title>
<meta property="og:title" content="Tennis Tracker — wynik meczu" />
<meta property="og:description" content="Zobacz wynik meczu zapisany w aplikacji Tennis Tracker." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#111144" />
<style>
  :root{
    --bg:#111144; --bg2:#223382; --accent:#f98513; --accent2:#ffab4d;
    --text:#f4f1ec; --text-sub:rgba(244,241,236,0.65); --text-muted:rgba(244,241,236,0.4);
    --surface:rgba(155,172,216,0.08); --border:rgba(155,172,216,0.20);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; min-height:100dvh; font-family:'Barlow Condensed','Oswald',-apple-system,'Segoe UI',sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 12% -10%, rgba(155,172,216,0.22) 0%, transparent 42%),
      radial-gradient(circle at 100% 105%, rgba(249,133,19,0.16) 0%, transparent 46%),
      linear-gradient(165deg, #0c0c33 0%, #111144 38%, #1b2456 72%, var(--bg2) 100%);
    background-attachment:fixed;
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(16px + env(safe-area-inset-right,0px)) 24px calc(16px + env(safe-area-inset-left,0px));
  }
  .card{
    width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
    border-radius:18px; padding:28px 22px; text-align:center; backdrop-filter:blur(10px);
  }
  .brand{
    font-size:12px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:18px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .live-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800;
    letter-spacing:0.08em; color:#ef4444; background:rgba(239,68,68,0.15);
    border:1px solid rgba(239,68,68,0.4); padding:4px 10px; border-radius:20px; margin-bottom:14px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.55;} }
  .pro-badge{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.12em;
    color:#171b38; background:var(--accent); padding:3px 10px; border-radius:10px; margin-bottom:14px;
  }
  .players{ font-size:21px; font-weight:800; line-height:1.5; }
  .vs{ font-size:12px; color:var(--text-muted); font-weight:700; letter-spacing:0.08em; margin:2px 0; }
  .winner{ color:var(--accent); }
  .winner .trophy{ margin-right:4px; }
  .sets{
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
    font-size:26px; font-weight:800; color:var(--accent); margin:18px 0 6px;
  }
  .game{ font-size:38px; font-weight:800; color:var(--text); margin:6px 0 14px; }
  .game .colon{ color:var(--text-muted); margin:0 10px; }
  .meta{ font-size:13px; color:var(--text-sub); }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--accent); margin-right:5px; vertical-align:middle; }
  .footer{ margin-top:22px; font-size:11px; color:var(--text-muted); }
  .error{ font-size:15px; color:var(--text-sub); padding:20px 0; }

  /* ---------- karta Pro ---------- */
  .pro-section{ text-align:left; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
  .section-title{ font-size:11px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
  .time-row{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--text-sub); padding:4px 0; }
  .time-row strong{ color:var(--text); font-variant-numeric:tabular-nums; }
  .time-sets{ font-size:12.5px; color:var(--text-sub); padding:4px 0; }
  .time-sets strong{ color:var(--text); font-variant-numeric:tabular-nums; }
  .stat-head{ display:flex; align-items:center; margin-bottom:4px; }
  .stat-head span{ flex:1; font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase; }
  .stat-head span:last-child{ text-align:right; }
  .stat-row{ display:flex; align-items:center; font-size:13px; padding:6px 0; border-top:1px solid var(--border); }
  .stat-row strong{ flex:1; font-size:14px; }
  .stat-row strong:last-child{ text-align:right; }
  .stat-label{ flex:1.6; text-align:center; font-size:10.5px; color:var(--text-muted); text-transform:uppercase; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">🎾 Tennis Tracker</div>
  <div id="content"><div class="error">Wczytywanie…</div></div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

  const SURFACE_COLORS = { "Ziemna": "#e8813f", "Twarda": "#38bdf8", "Trawa": "#4ade80" };
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDgjd3EhID7KR-krrNNXx3Uv5yny9LkCsE",
    authDomain: "tenis-tracker-live.firebaseapp.com",
    databaseURL: "https://tenis-tracker-live-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tenis-tracker-live",
    storageBucket: "tenis-tracker-live.firebasestorage.app",
    messagingSenderId: "724796439670",
    appId: "1:724796439670:web:da904995717555fa0ff357",
  };
  const STAT_LABELS = [
    ["aces", "Asy serwisowe"],
    ["doubleFaults", "Podwójne błędy"],
    ["winners", "Winnery"],
    ["forcedErrors", "Wymuszone błędy"],
    ["unforcedErrors", "Niewymuszone błędy"],
    ["netPoints", "Punkty przy siatce"],
  ];

  function fromBase64Url(b64url) {
    let b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    return decodeURIComponent(escape(atob(b64)));
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = String(s == null ? "" : s);
    return d.innerHTML;
  }

  function formatDur(ms) {
    if (ms == null || ms < 0) return "—";
    const totalSec = Math.round(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    const mm = h > 0 ? String(m).padStart(2, "0") : String(m);
    const ss = String(s).padStart(2, "0");
    return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  function renderMatch(data, opts) {
    opts = opts || {};
    const content = document.getElementById("content");
    if (!data) {
      content.innerHTML = '<div class="error">' +
        (opts.live ? "Ten mecz nie jest teraz udostępniany na żywo." : "Nieprawidłowy link do wyniku.") +
        "</div>";
      return;
    }

    const t1 = (data.t1 || []).filter(Boolean).join(" / ") || "Gracz 1";
    const t2 = (data.t2 || []).filter(Boolean).join(" / ") || "Gracz 2";
    const sets = Array.isArray(data.sets) ? data.sets : Array.isArray(data.s) ? data.s : [];
    const surface = data.sf || null;
    document.documentElement.style.setProperty("--accent", SURFACE_COLORS[surface] || "#f98513");

    const winner = data.w || data.matchWinner || null;
    const p1Class = winner === "team1" ? "winner" : "";
    const p2Class = winner === "team2" ? "winner" : "";
    const trophy1 = winner === "team1" ? '<span class="trophy">🏆</span>' : "";
    const trophy2 = winner === "team2" ? '<span class="trophy">🏆</span>' : "";
    const ball1 = !winner && data.server === "team1" ? " 🎾" : "";
    const ball2 = !winner && data.server === "team2" ? " 🎾" : "";

    let gameRow = "";
    if (!winner && (data.gameA != null || data.gameB != null)) {
      gameRow = '<div class="game">' + esc(data.gameA) + '<span class="colon">:</span>' + esc(data.gameB) + "</div>";
    }

    const metaParts = [];
    if (data.d) metaParts.push("📅 " + esc(data.d));
    if (surface) metaParts.push('<span class="dot"></span>' + esc(surface));

    content.innerHTML =
      (opts.live ? '<div class="live-badge">🔴 NA ŻYWO</div>' : "") +
      '<div class="players ' + p1Class + '">' + trophy1 + esc(t1) + ball1 + "</div>" +
      '<div class="vs">vs.</div>' +
      '<div class="players ' + p2Class + '">' + trophy2 + esc(t2) + ball2 + "</div>" +
      '<div class="sets">' + sets.map((s) => "<span>" + esc(s) + "</span>").join("") + "</div>" +
      gameRow +
      '<div class="meta">' + metaParts.join(" &nbsp;·&nbsp; ") + "</div>" +
      '<div class="footer">Wynik ' + (winner ? "zapisany" : "na żywo") + " w aplikacji Tennis Tracker</div>";
  }

  // "Karta Pro" — pełny raport z meczu (wynik + czasy + statystyki punktowe),
  // dokładnie te dane, które MatchSummaryPage pokazuje w samej aplikacji.
  function renderProMatch(data) {
    const content = document.getElementById("content");
    if (!data) {
      content.innerHTML = '<div class="error">Nieprawidłowy link do karty.</div>';
      return;
    }

    const t1 = (data.t1 || []).filter(Boolean).join(" / ") || "Gracz 1";
    const t2 = (data.t2 || []).filter(Boolean).join(" / ") || "Gracz 2";
    const sets = Array.isArray(data.s) ? data.s : [];
    const surface = data.sf || null;
    document.documentElement.style.setProperty("--accent", SURFACE_COLORS[surface] || "#f98513");

    const winner = data.w || null;
    const p1Class = winner === "team1" ? "winner" : "";
    const p2Class = winner === "team2" ? "winner" : "";
    const trophy1 = winner === "team1" ? '<span class="trophy">🏆</span>' : "";
    const trophy2 = winner === "team2" ? '<span class="trophy">🏆</span>' : "";

    const metaParts = [];
    if (data.d) metaParts.push("📅 " + esc(data.d));
    if (surface) metaParts.push('<span class="dot"></span>' + esc(surface));

    let timeHtml = "";
    if (data.md != null) {
      let setTimes = "";
      if (Array.isArray(data.sd) && data.sd.length) {
        setTimes = '<div class="time-sets">' +
          data.sd.map((ms, i) => "Set " + (i + 1) + ": <strong>" + formatDur(ms) + "</strong>").join(" &nbsp; ") +
          "</div>";
      }
      timeHtml =
        '<div class="pro-section"><div class="section-title">Czas meczu</div>' +
        '<div class="time-row"><span>⏱ Czas meczu</span><strong>' + formatDur(data.md) + "</strong></div>" +
        setTimes +
        (data.apm != null ? '<div class="time-row"><span>Średnia długość punktu</span><strong>' + formatDur(data.apm) + "</strong></div>" : "") +
        (data.lpm != null ? '<div class="time-row"><span>Najdłuższy punkt</span><strong>' + formatDur(data.lpm) + "</strong></div>" : "") +
        "</div>";
    }

    let statsHtml = "";
    if (data.st1 && data.st2) {
      statsHtml =
        '<div class="pro-section"><div class="section-title">Statystyki</div>' +
        '<div class="stat-head"><span>' + esc(t1) + "</span><span>" + esc(t2) + "</span></div>" +
        STAT_LABELS.map(([key, label]) =>
          '<div class="stat-row"><strong>' + (data.st1[key] ?? 0) + '</strong><span class="stat-label">' + label + "</span><strong>" + (data.st2[key] ?? 0) + "</strong></div>"
        ).join("") +
        (data.ar != null ? '<div class="time-row"><span>Średnia długość wymiany</span><strong>' + esc(data.ar) + " uderzeń</strong></div>" : "") +
        "</div>";
    }

    content.innerHTML =
      '<div class="pro-badge">KARTA PRO</div>' +
      '<div class="players ' + p1Class + '">' + trophy1 + esc(t1) + "</div>" +
      '<div class="vs">vs.</div>' +
      '<div class="players ' + p2Class + '">' + trophy2 + esc(t2) + "</div>" +
      '<div class="sets">' + sets.map((s) => "<span>" + esc(s) + "</span>").join("") + "</div>" +
      '<div class="meta">' + metaParts.join(" &nbsp;·&nbsp; ") + "</div>" +
      timeHtml + statsHtml +
      '<div class="footer">Pełny raport z meczu — Tennis Tracker</div>';
  }

  function init() {
    const params = new URLSearchParams(window.location.search);
    const liveId = params.get("live");
    const staticData = params.get("d");
    const proData = params.get("pro");

    if (liveId) {
      const app = initializeApp(FIREBASE_CONFIG);
      const database = getDatabase(app);
      onValue(
        ref(database, "liveMatches/" + liveId),
        (snapshot) => renderMatch(snapshot.val(), { live: true }),
        () => renderMatch(null, { live: true })
      );
      return;
    }

    if (proData) {
      try {
        renderProMatch(JSON.parse(fromBase64Url(proData)));
      } catch (e) {
        renderProMatch(null);
      }
      return;
    }

    if (staticData) {
      try {
        renderMatch(JSON.parse(fromBase64Url(staticData)));
      } catch (e) {
        renderMatch(null);
      }
      return;
    }

    renderMatch(null);
  }

  init();
</script>
</body>
</html>
