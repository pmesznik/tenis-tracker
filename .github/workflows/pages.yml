name: Deploy pages (share + docs) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "share-site/**"
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare combined Pages content
        run: |
          mkdir -p pages-dist/docs
          cp -r share-site/. pages-dist/
          cp -r docs-site/. pages-dist/docs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - id: deployment
        uses: actions/deploy-pages@v4
